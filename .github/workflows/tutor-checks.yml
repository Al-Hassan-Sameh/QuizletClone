name: Study tutor checks
on:
  push:
    branches: [codex/context-aware-study-tutor]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:tutor:server
      - run: npm run build:pages
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
